# Local development services: Postgres + ClamAV
# Usage: docker compose -f infra/docker/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    container_name: studentapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-studentapp}
    ports:
      - "5433:5432" # host 5433 avoids clashing with a local Postgres on 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-studentapp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:1.5-debian
    ports:
      - "3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav

volumes:
  postgres-data:
  clamav-db:
